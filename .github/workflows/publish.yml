#
# Publish @nurvus/ui to the public npm registry on every push to main that
# changes the package (see `paths`). No release step, no version-bump commits.
#
# VERSION: the run number becomes the alpha number (GitHub's version of
#   CircleCI's $CIRCLE_BUILD_NUM). package.json holds the BASE version
#   (0.1.0-alpha.1 → base 0.1.0); this job sets 0.1.0-alpha.<run_number + 1>
#   in its own checkout only, then publishes. The +1 skips alpha.1, which was
#   published by hand on 2026-07-30. Consumers pick up new versions with
#   `npm update @nurvus/ui` (or install @nurvus/ui@alpha).
#
# AUTH: npm Trusted Publishing (OIDC). No stored token, no 2FA code.
#   npmjs.com → @nurvus/ui → Settings → Trusted Publisher → GitHub Actions:
#   kwehhh / nurvus-design-system / publish.yml (set up 2026-10-25).
#   GitHub hands this job a short-lived signed identity ("publish.yml in
#   kwehhh/nurvus-design-system"); npm checks it against that rule.
#   Needs `id-token: write` and npm >= 11.5.1. package.json `repository.url`
#   must name this repo, or npm rejects the provenance.
#
# DIST-TAGS: each version publishes under `alpha`, then `latest` is moved to
#   it too. Until there is a stable 1.0 the newest alpha IS the latest, and
#   otherwise a bare `npm install @nurvus/ui` keeps getting whatever `latest`
#   pointed at (npm set it to the hand-published alpha.1 and nothing moved it).
#   The trusted publisher has the dist-tag permission for this.
#
name: Publish to npm

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'tools/**'
      - 'package.json'
      - 'package-lock.json'
      - 'webpack.config.js'
      - '.babelrc'
      - '.github/workflows/publish.yml'
  # Manual run from the Actions tab, e.g. to re-publish after a failed run.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for npm OIDC trusted publishing + provenance

# Never run two publishes at once; queue them in push order.
concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Use latest npm (trusted publishing needs >= 11.5.1)
        run: npm install -g npm@latest

      # `prepare` builds dist/ here (and again inside `npm publish`).
      - name: Install dependencies
        run: npm ci

      - name: Verify build output
        run: test -f dist/index.js || (echo "dist/index.js missing after build" && exit 1)

      - name: Set the version from the run number
        run: |
          BASE=$(node -p "require('./package.json').version.split('-')[0]")
          VERSION="$BASE-alpha.$((GITHUB_RUN_NUMBER + 1))"
          npm version "$VERSION" --no-git-tag-version
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Publishing @nurvus/ui@$VERSION"

      - name: Publish to npm under the alpha tag (with provenance)
        run: npm publish --tag alpha --provenance

      - name: Point the latest tag at it too (until a stable 1.0)
        run: npm dist-tag add "@nurvus/ui@$VERSION" latest
