name: Build & Deploy

# Build the styleguide in the runner (which has Node), then rsync the static
# output to the server as `jcage` into the jcage-owned serve dir. No building
# on the box, no sudo — avoids the old "npm: command not found" / "Permission
# denied on /var/www" failures.
on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install dependencies
        run: npm ci

      - name: Build styleguide
        run: npm run styleguide:build
        env:
          # old webpack + modern Node needs the legacy OpenSSL provider
          NODE_OPTIONS: --openssl-legacy-provider

      - name: Deploy to design.nurvus.ai (rsync as jcage)
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          rsync -az --delete \
            -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            styleguide/build/ \
            "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:/var/www/design.nurvus.ai/"
          echo "Deployed styleguide to design.nurvus.ai"
